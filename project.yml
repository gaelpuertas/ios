name: VinSOAT
options:
  bundleIdPrefix: com.vinsoat
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  VinSOAT:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - codemagic.yaml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinsoat.ios
        INFOPLIST_KEY_CFBundleDisplayName: VinSOAT
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSCameraUsageDescription: VinSOAT no necesita acceso a la cámara.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: VinSOAT no necesita acceso a tus fotos.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
