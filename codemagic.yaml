workflows:
  ios-release:
    name: VinSOAT iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vinsoat.ios
      vars:
        APP_STORE_CONNECT_APPLE_ID: "REEMPLAZAR_CON_APPLE_ID"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Apply signing profiles
        script: |
          xcode-project use-profiles
      - name: Archive and export IPA
        script: |
          xcode-project build-ipa \
            --project "VinSOAT.xcodeproj" \
            --scheme "VinSOAT"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: false
        beta_groups:
          - Internal Testers
